name: Données et publication

# Prix poe.ninja, historique de la ligue, base des uniques (Path of Building), puis publication du site
# sur GitHub Pages. Déclenché toutes les 30 min par « Relance des données » (relance.yml), à chaque push
# sur main, et en secours par le cron ci-dessous (toutes les 2 h) si la relance est arrêtée.
on:
  schedule:
    - cron: '52 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données existantes (branche data)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
          else
            mkdir data && git -C data init --quiet -b data
          fi

      - name: Mettre à jour prix, historique et uniques
        run: node tools/update-data.mjs data

      - name: Enregistrer la branche data (un seul commit, réécrit à chaque passage)
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan tmp
          git add -A
          git commit --quiet -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git branch -M data
          git push --quiet --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
          du -sh --exclude=.git .

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp coffres-poe1.html coffres-poe2.html index.html poe-stash-scanner.user.js manifest.webmanifest icon.svg icon-192.png icon-512.png README.md _site/
          touch _site/.nojekyll
          rsync -a --exclude .git data/ _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
