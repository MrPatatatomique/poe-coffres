name: Vérifications

# À chaque push et pull request : la copie de shared/ninja.js dans le script Violentmonkey est à jour,
# et les transformations poe.ninja donnent les lignes attendues.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script Violentmonkey à jour avec shared/ninja.js
        run: node tools/build-userscript.mjs --check
      - name: Tests poe.ninja
        run: node tools/test-ninja.mjs
